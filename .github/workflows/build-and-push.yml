name: CI and Release Promotion

# Filename kept as build-and-push.yml for badge-URL stability, but this
# workflow no longer builds/pushes images from source. RC images are built
# and pushed manually (`make rc-release`) and validated locally (`make
# uat-validate`) from a `release/X.Y` branch before a version tag exists; on
# tag push, the `promote` job below only retags the already-validated
# rc-<shortsha> manifest. `release/**` runs test/lint like main/develop so
# the branch is verified before it's tagged and squash-merged back to main.
on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Deny all permissions by default; each job grants only what it needs.
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      # Required by dorny/test-reporter to post check annotations
      checks: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.1'

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run tests
        run: |
          gotestsum --junitfile test-results.xml -- \
            ./... -coverprofile=coverage.out -covermode=atomic

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Go Unit Tests
          path: test-results.xml
          reporter: java-junit
          # Job failure comes from gotestsum above; reporter is for UI only.
          fail-on-error: false

      - name: Enforce coverage threshold
        run: |
          # Raise MIN_COVERAGE as test coverage improves over time.
          MIN_COVERAGE=15
          COVERAGE=$(go tool cover -func=coverage.out \
            | grep '^total:' | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%  (minimum: ${MIN_COVERAGE}%)"
          if awk "BEGIN { exit !($COVERAGE + 0 < $MIN_COVERAGE) }"; then
            echo "::error::Coverage ${COVERAGE}% is below the ${MIN_COVERAGE}% minimum threshold."
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.1'
      
      - name: Run go fmt
        run: gofmt -d . | head -20 && test -z "$(gofmt -l .)" || (echo "Go code is not formatted"; exit 1)
      
      - name: Run go vet
        run: go vet ./...
      
      - name: Build
        run: go build -v ./cmd/curator

  e2e:
    # Run the full E2E suite only on minor/major version tags (vX.Y.0) — these
    # represent intentional minor/major cuts and warrant the full gate before
    # publishing. Patch tags (vX.Y.Z where Z > 0) skip e2e so iteration is fast;
    # GitHub Actions treats a skipped dependency as success, so build-and-push
    # still runs normally for patch releases.
    if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref_name, '.0')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run E2E smoke suite
        run: make test-e2e

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ github.ref_name }}
          path: tests/e2e/results/
          retention-days: 30

  promote:
    # Only runs on version tag pushes. Does NOT rebuild from source — it
    # retags the exact rc-<shortsha> manifest that was already built, pushed,
    # and locally UAT-validated (see `make rc-release` / `make uat-validate`)
    # before this tag was created, guaranteeing byte-identical provenance
    # between what was validated and what gets deployed.
    needs: [test, lint, e2e]
    if: startsWith(github.ref, 'refs/tags/v') && !failure() && !cancelled()
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify version constant matches tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          const_version=$(grep -oE 'version = "[^"]+"' cmd/curator/main.go | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "tag=${tag_version} const=${const_version}"
          if [ "${tag_version}" != "${const_version}" ]; then
            echo "::error::Tag v${tag_version} does not match cmd/curator/main.go version constant (${const_version})."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify RC image exists for this commit
        id: rc
        run: |
          rc_sha=$(git rev-parse --short HEAD)
          rc_ref="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:rc-${rc_sha}"
          echo "rc_ref=${rc_ref}" >> "$GITHUB_OUTPUT"
          if ! docker buildx imagetools inspect "${rc_ref}" > /dev/null 2>&1; then
            echo "::error::No validated RC image found at ${rc_ref}. Run 'make rc-release' and validate with 'make uat-up REF=rc-${rc_sha}' + 'make uat-validate' before tagging a release."
            exit 1
          fi

      - name: Extract semver tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Promote validated RC to release tags (no rebuild)
        run: |
          tags="${{ steps.meta.outputs.tags }}"
          tag_args=""
          while IFS= read -r t; do
            [ -n "$t" ] && tag_args="$tag_args -t $t"
          done <<< "$tags"
          echo "Promoting ${{ steps.rc.outputs.rc_ref }} ->$tag_args"
          docker buildx imagetools create $tag_args "${{ steps.rc.outputs.rc_ref }}"
